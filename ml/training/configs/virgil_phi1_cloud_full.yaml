# VIRGIL-PHI1 Cloud Full Quality Version
# For high-quality 8-bit or fp16 inference on cloud GPUs (H100/A100, Together, Fireworks, vLLM, etc.)
# Train on H100 with 8-bit or bf16 for best adapter quality.
# Then merge and quantize to 8-bit for serving (best quality/speed balance for cloud).

model_name_or_path: microsoft/phi-4
trust_remote_code: true

# Quantization for training - 8-bit for good quality on cloud
quantization: "8bit"   # Options: "4bit", "8bit", "bf16"

# LoRA - Higher rank for maximum quality
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_rank: 64
lora_alpha: 64
lora_dropout: 0.0
use_rslora: true

# Dataset - Full mix for org-level investigator
dataset_path: data/virgil_phi1_train.jsonl
template: phi
cutoff_len: 8192
max_samples: null
packing: true
preprocessing_num_workers: 16

# Output
output_dir: outputs/VIRGIL-PHI1-Cloud-Full
run_name: virgil-phi1-cloud-full

# Training - High quality on H100
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.2e-5
num_train_epochs: 3.0   # 3 epochs for best quality
lr_scheduler_type: cosine
warmup_steps: 100
optim: adamw_8bit
weight_decay: 0.01
bf16: true
gradient_checkpointing: true

# Evaluation during training
eval_dataset: data/virgil_phi1_eval.jsonl
per_device_eval_batch_size: 4
eval_strategy: steps
eval_steps: 400
load_best_model_at_end: true
metric_for_best_model: eval_loss

# Logging
report_to: wandb
logging_steps: 10
save_strategy: steps
save_steps: 400
save_total_limit: 4
